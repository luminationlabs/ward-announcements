<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" fill="none" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="3.2" markerHeight="3.6" refX="2" refY="1.8" orient="auto">
      <path d="M0 0 L3 1.8 L0 3.6 Z" fill="#ff3b30" />
    </marker>
  </defs>
  <!-- menu card -->
  <rect x="96" y="8" width="216" height="284" rx="16" fill="#fbfbfd" stroke="#e6e6ea" stroke-width="1.5" />

  <!-- Share (highlighted target) -->
  <path d="M124 46 V34 M120 38 L124 33.5 L128 38" stroke="#1c1c1e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M119 43 V49 H129 V43" stroke="#1c1c1e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  <text x="150" y="46" font-size="17" fill="#1c1c1e">Share</text>

  <!-- Add to Bookmarks -->
  <path d="M119 73 V91 L124 86.5 L129 91 V73 Z" stroke="#1c1c1e" stroke-width="1.8" stroke-linejoin="round" />
  <text x="150" y="87" font-size="17" fill="#1c1c1e">Add to Bookmarks</text>

  <!-- Add Bookmark to… -->
  <path d="M118 112 h11 a2 2 0 0 1 2 2 v14 h-13 z M118 112 a2 2 0 0 0 -2 2 v14" stroke="#1c1c1e" stroke-width="1.8" stroke-linejoin="round" />
  <text x="150" y="127" font-size="17" fill="#1c1c1e">Add Bookmark to…</text>

  <line x1="108" y1="146" x2="312" y2="146" stroke="#ececec" stroke-width="1.5" />

  <!-- New Tab -->
  <path d="M124 167 V181 M117 174 H131" stroke="#1c1c1e" stroke-width="2" stroke-linecap="round" />
  <text x="150" y="180" font-size="17" fill="#1c1c1e">New Tab</text>

  <!-- New Private Tab -->
  <circle cx="120" cy="214" r="3.6" fill="none" stroke="#1c1c1e" stroke-width="1.8" />
  <circle cx="129" cy="214" r="3.6" fill="none" stroke="#1c1c1e" stroke-width="1.8" />
  <line x1="123.6" y1="214" x2="125.4" y2="214" stroke="#1c1c1e" stroke-width="1.8" />
  <text x="150" y="220" font-size="17" fill="#1c1c1e">New Private Tab</text>

  <line x1="108" y1="240" x2="312" y2="240" stroke="#ececec" stroke-width="1.5" />

  <!-- bottom row -->
  <rect x="151" y="252" width="14" height="16" rx="2" fill="none" stroke="#1c1c1e" stroke-width="1.8" />
  <text x="158" y="284" font-size="14" fill="#1c1c1e" text-anchor="middle">Bookmarks</text>
  <rect x="244" y="252" width="13" height="13" rx="2" fill="none" stroke="#1c1c1e" stroke-width="1.8" />
  <rect x="248" y="256" width="13" height="13" rx="2" fill="#fbfbfd" stroke="#1c1c1e" stroke-width="1.8" />
  <text x="252" y="284" font-size="14" fill="#1c1c1e" text-anchor="middle">All Tabs</text>

  <!-- red arrow pointing at Share from the empty upper-right (tip clears the word) -->
  <line x1="284" y1="8" x2="200" y2="42" stroke="#ff3b30" stroke-width="5" stroke-linecap="butt" marker-end="url(#arrowhead)" />
</svg>
