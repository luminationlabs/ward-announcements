<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 210" fill="none" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="3.2" markerHeight="3.6" refX="2" refY="1.8" orient="auto">
      <path d="M0 0 L3 1.8 L0 3.6 Z" fill="#ff3b30" />
    </marker>
  </defs>
  <rect x="6" y="6" width="308" height="198" rx="18" fill="#fff" stroke="#e6e6ea" stroke-width="2" />
  <line x1="50" y1="57" x2="314" y2="57" stroke="#ececec" stroke-width="1.5" />
  <line x1="50" y1="105" x2="314" y2="105" stroke="#ececec" stroke-width="1.5" />
  <line x1="50" y1="153" x2="314" y2="153" stroke="#ececec" stroke-width="1.5" />

  <!-- Add Bookmark to… (open book) -->
