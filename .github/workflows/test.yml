name: Tests

# `npm test`: the build, then every test/*.test.js against a real Node server on a throwaway
# database. The Workers suites (`npm run test:worker`, `npm run test:host`) start several
# `wrangler dev` servers and stay a local step (AGENTS.md says when to run them).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # package.json "engines": ^22.23.4 || ^24.22.1 || >=26.12.1; setup-node takes the newest of each line.
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # The npm that Node 22 bundles tries to compile better-sqlite3 rather than use its prebuilt
      # binary (see the Dockerfile); npm 12 doesn't.
      - run: npm install -g npm@12.0.2
      - run: npm ci
      - run: npm test
