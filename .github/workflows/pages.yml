name: Site

# The README as a one-page site (oneward.org): rendered by GitHub's own Markdown API, so it reads
# as it does on the repository's front page, with its images alongside and its relative links
# pointed at the files on GitHub. Only the README is published, not the repository: Jekyll, what
# Pages runs on a branch, would read `{{` in docs/ARCHITECTURE.md as a template and fail. The
# custom domain is set in the repository's Pages settings rather than by a CNAME file, so a ward
# that copies this repository inherits no domain, and the job below runs only here.

on:
  push:
    branches: [main]
    paths: [README.md, 'docs/images/**', .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'luminationlabs/ward-announcements'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render the README
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site/docs
          cp -r docs/images _site/docs/images
          gh api -X POST /markdown -f mode=gfm -f context="$GITHUB_REPOSITORY" -F text=@README.md > body.html
          node scripts/readme-site.mjs body.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
